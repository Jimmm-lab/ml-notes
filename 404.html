<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>找不到這一頁｜機器學習互動講義</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;900&display=swap" rel="stylesheet">
<style>


:root{
  --paper:#FBFCFD; --panel:#F0F4F7; --ink:#1B2A41; --muted:#5B6B7F; --line:#D6DEE6;
  --sea:#11808F; --sea-soft:#DCEFF1; --sun:#C98A1B; --sun-soft:#FBEFD6; --red:#C2463A;
  --serif:"Noto Serif TC","Songti TC",serif; --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#121A24; --panel:#1B2633; --ink:#E6ECF2; --muted:#9AA9B9; --line:#2E3B4A;
    --sea:#4CC0CE; --sea-soft:#15343A; --sun:#E8B04E; --sun-soft:#3A2F17; --red:#EE7A6E;
  }
}
:root[data-theme="dark"]{
  --paper:#121A24; --panel:#1B2633; --ink:#E6ECF2; --muted:#9AA9B9; --line:#2E3B4A;
  --sea:#4CC0CE; --sea-soft:#15343A; --sun:#E8B04E; --sun-soft:#3A2F17; --red:#EE7A6E;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.75}
main{max-width:760px;margin:0 auto;padding:28px 20px 80px}
h1,h2,h3{font-family:var(--serif);line-height:1.3;margin:0}
h1{font-size:clamp(30px,7vw,46px);font-weight:900;letter-spacing:.01em}
h2{font-size:clamp(23px,5vw,30px);font-weight:900;margin:64px 0 14px}
h3{font-size:19px;font-weight:600;margin:28px 0 8px}
p{margin:0 0 14px}
.lede{color:var(--muted);font-size:18px;margin-top:12px}
.slide-ref{font-size:14px;color:var(--muted);margin:-6px 0 18px}
code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.88em;background:var(--panel);padding:1px 5px;border-radius:4px}
.box{background:var(--panel);border-radius:12px;padding:18px 18px 8px;margin:18px 0}
.warn{background:var(--sun-soft);border-radius:12px;padding:16px 18px 6px;margin:18px 0}
.math{overflow-x:auto;padding:6px 0;margin:10px 0 16px}
.scroll{overflow-x:auto}
button,input{font:inherit}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--sea);outline-offset:2px}

/* 8-step track */
.track{list-style:none;padding:0;margin:26px 0 0;display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.track li{border:1px solid var(--line);border-radius:10px;padding:10px 10px 8px;font-size:14px;line-height:1.45;position:relative}
.track li b{display:block;font-family:var(--serif);font-size:22px;color:var(--muted)}
.track li.now{background:var(--sea);border-color:var(--sea);color:var(--paper)}
.track li.now b{color:var(--paper)}
.track li small{display:block;margin-top:4px;opacity:.75;font-size:12px}
@media (max-width:560px){.track{grid-template-columns:repeat(2,1fr)}}

/* pipeline */
.pipe{display:flex;align-items:stretch;gap:0;margin:20px 0 8px;flex-wrap:nowrap}
.node{flex:1;text-align:center;border:1px solid var(--line);border-radius:10px;padding:10px 6px;font-size:14px;line-height:1.4;background:var(--paper)}
.node.me{border:2px solid var(--sea);background:var(--sea-soft);font-weight:700}
.arrow{align-self:center;color:var(--muted);padding:0 4px;font-size:18px}
@media (max-width:560px){.pipe{flex-direction:column}.arrow{transform:rotate(90deg);text-align:center;padding:2px 0}}

/* framing */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.chip{border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;padding:7px 14px;cursor:pointer;font-size:15px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.axes{display:grid;grid-template-columns:1fr;gap:8px;margin-top:10px}
.axis{display:grid;grid-template-columns:7.5em 1fr;gap:10px;align-items:start;padding:10px 0;border-top:1px solid var(--line)}
.axis .k{color:var(--muted);font-size:14px;padding-top:2px}
.axis .v strong{display:inline-block;margin-bottom:2px}
.axis .v span{display:block;font-size:15px;color:var(--muted)}
.axis.changed .v strong{color:var(--sun)}

/* data matrix */
table{border-collapse:collapse;font-size:14px;width:100%}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th{font-weight:500;color:var(--muted);font-size:13px}
td:first-child,th:first-child{text-align:left}
.lab{background:var(--sun-soft)}
.num{font-variant-numeric:tabular-nums}

/* lab */
.lab-panel{border:1px solid var(--line);border-radius:14px;padding:18px;margin:20px 0}
.lab-panel label{display:block;font-weight:500;margin-bottom:6px}
input[type=range]{width:100%;accent-color:var(--sea)}
.readout{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0}
.readout div{background:var(--panel);border-radius:10px;padding:10px 12px}
.readout small{display:block;color:var(--muted);font-size:13px}
.readout b{font-size:24px;font-family:var(--serif);font-variant-numeric:tabular-nums}
.shares{margin-top:10px}
.share-row{display:grid;grid-template-columns:4.2em 1fr;gap:8px;align-items:center;margin:6px 0;font-size:13px;color:var(--muted)}
.bar{display:flex;height:22px;border-radius:6px;overflow:hidden;background:var(--panel)}
.bar span{display:block;height:100%;border-right:1px solid var(--paper);transition:width .25s}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:13px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:4px;vertical-align:-1px}
@media (prefers-reduced-motion:reduce){.bar span{transition:none}}

.norm-grid{display:grid;grid-template-columns:1fr 170px;gap:18px;align-items:start}
@media (max-width:560px){.norm-grid{grid-template-columns:1fr}.norm-grid .ball-svg{max-width:200px;margin:0 auto;display:block}}
.meanline{position:relative;height:46px;margin:14px 0 4px;border-bottom:2px solid var(--line)}
.meanline .tick{position:absolute;bottom:-6px;width:2px;height:12px;background:var(--muted)}
.meanline .tick em{position:absolute;bottom:14px;left:-10px;font-style:normal;font-size:11px;color:var(--muted)}
.meanline .pin{position:absolute;bottom:-9px;width:16px;height:16px;margin-left:-8px;border-radius:50%;background:var(--sea);transition:left .2s}
.meanline .pin.mae{background:transparent;border:2px dashed var(--muted)}
.meanline .pin.rmse{background:transparent;border:2px solid var(--sun)}

details{border-top:1px solid var(--line);padding:12px 0}
summary{cursor:pointer;font-weight:500}
details p{margin-top:10px}
.next{margin-top:56px;padding:20px;border-radius:14px;background:var(--sea-soft)}
.next ol{margin:8px 0 0;padding-left:1.4em}
.next li.done{color:var(--muted)}
footer{margin-top:36px;font-size:13px;color:var(--muted)}
pre{background:var(--panel);border-radius:10px;padding:14px 16px;overflow-x:auto;font-size:14px;line-height:1.6;margin:14px 0}
pre code{background:none;padding:0}
.cm{color:var(--muted)}
.toc{margin:22px 0 0;padding:14px 18px;border:1px solid var(--line);border-radius:12px}
.toc strong{font-size:15px}
.toc ol{margin:6px 0 0;padding-left:1.4em;font-size:15px;line-height:1.9}
.toc a,.pager a{color:var(--sea);text-decoration:none}
.toc a:hover,.pager a:hover{text-decoration:underline}
.keys{margin:18px 0 0;padding:16px 18px 6px;border-radius:12px;background:var(--sea-soft)}
.keys ul{margin:6px 0 10px;padding-left:1.2em}
.keys li{margin:4px 0}
.derive{border-left:0;background:var(--panel);border-radius:12px;padding:16px 18px 8px;margin:18px 0}
.derive .step{font-size:15px;color:var(--muted);margin:10px 0 2px}
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:28px;font-size:15px}
.pager span{color:var(--muted)}
.trap{margin:10px 0;padding:12px 16px;border:1px solid var(--line);border-radius:10px}
.trap b{display:block;margin-bottom:2px}
section{scroll-margin-top:12px}

canvas{display:block;width:100%;border-radius:10px;background:var(--panel);touch-action:pan-y}
.ctrl{display:grid;grid-template-columns:1fr;gap:10px;margin-top:12px}
.ctrl label.inline{display:inline-flex;gap:8px;align-items:center;font-weight:400;margin-right:16px}
.rbig{display:flex;align-items:baseline;gap:10px;margin:10px 0 2px}
.rbig b{font-family:var(--serif);font-size:30px;font-variant-numeric:tabular-nums}
.rbig span{color:var(--muted);font-size:15px}
.cbar{height:10px;border-radius:5px;background:linear-gradient(90deg,#1f3fbf,#27b6d6,#f2dd4a,#e8702a,#b3161b);margin:8px 0 2px}
.cbar-lab{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.div-row{display:grid;grid-template-columns:11.5em 1fr 4.2em;gap:8px;align-items:center;font-size:13px;margin:3px 0}
.div-row .nm{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;overflow-wrap:anywhere;line-height:1.3}
.div-row .val{text-align:right;font-variant-numeric:tabular-nums}
.div-track{position:relative;height:16px;background:var(--panel);border-radius:4px}
.div-track .mid{position:absolute;left:50%;top:0;bottom:0;width:1px;background:var(--muted)}
.div-track .fill{position:absolute;top:2px;height:12px;border-radius:3px}
.div-row.new .nm{color:var(--sun);font-weight:700}
@media (max-width:560px){.div-row{grid-template-columns:9.5em 1fr 3.6em}.div-row .nm{font-size:11px}}
.sm-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:6px}
.sm-cell{aspect-ratio:1;border:1px solid var(--line);border-radius:6px;padding:0;background:var(--paper);cursor:pointer;overflow:hidden}
.sm-cell svg{width:100%;height:100%;display:block}
.sm-cell[aria-pressed="true"]{outline:3px solid var(--sun);outline-offset:1px}
.sm-lab{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;font-size:11px;color:var(--muted);text-align:center;margin-top:4px;font-family:ui-monospace,Menlo,monospace;word-break:break-all;line-height:1.3}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.cmp div{background:var(--panel);border-radius:10px;padding:12px}
.cmp h4{margin:0 0 4px;font-size:15px}
.cmp p{font-size:14px;margin:0;color:var(--muted)}
.cmp b{color:var(--ink)}


.sitebar{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;font-size:14px;color:var(--muted);margin:0 0 22px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.sitebar a{color:var(--sea);text-decoration:none;font-weight:500}
.sitebar a:hover{text-decoration:underline}
.sitebar .sep{opacity:.6}
.sitefoot{margin-top:40px;padding-top:14px;border-top:1px solid var(--line);font-size:13px;color:var(--muted);line-height:1.7}
.sitefoot a{color:var(--sea)}

main{text-align:center;padding-top:80px}
</style>
</head>
<body>
<main>
<h1>找不到這一頁</h1>
<p class="lede">網址可能打錯了，或這一頁已經搬家。</p>
<p><a id="home" href="./" style="color:var(--sea);font-weight:500">回到 機器學習互動講義 首頁 →</a></p>
</main>
<script>
// GitHub Pages project sites live under /<repo>/ — send the reader to that root
(function(){var seg=location.pathname.split('/').filter(Boolean);var a=document.getElementById('home');
if(location.hostname.endsWith('github.io')&&seg.length)a.href='/'+seg[0]+'/';else a.href='/';})();
</script>
</body>
</html>
